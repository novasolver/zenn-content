name: Daily Auto-Publish

on:
  schedule:
    - cron: "0 0 * * *"  # 0:00 UTC = 9:00 JST
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find next draft and publish
        id: pub
        run: |
          set -euo pipefail
          NEXT=$(grep -l "^published: false" articles/*.md 2>/dev/null | sort | head -1 || true)
          if [ -z "$NEXT" ]; then
            echo "No draft to publish."
            echo "published=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Publishing: $NEXT"
          sed -i 's/^published: false$/published: true/' "$NEXT"
          echo "published=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.pub.outputs.published != ''
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.pub.outputs.published }}"
          SLUG=$(basename "${{ steps.pub.outputs.published }}" .md)
          git commit -m "Auto-publish: ${SLUG}"
          git push
