name: Daily Auto-Publish

on:
  schedule:
    - cron: "0 0 * * *"  # 0:00 UTC = 9:00 JST
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish up to 2 drafts
        run: |
          set -euo pipefail
          # publish the alphabetically-first 2 drafts per run (temporary 2/day to clear the backlog)
          mapfile -t NEXT < <(grep -l "^published: false" articles/*.md 2>/dev/null | sort | head -2 || true)
          if [ ${#NEXT[@]} -eq 0 ]; then
            echo "No draft to publish."
            exit 0
          fi
          for f in "${NEXT[@]}"; do
            echo "Publishing: $f"
            sed -i 's/^published: false$/published: true/' "$f"
          done
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${NEXT[@]}"
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          SLUGS=$(printf '%s ' "${NEXT[@]##*/}" | sed 's/\.md//g')
          git commit -m "Auto-publish (2/day): ${SLUGS}"
          git push
